name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test CP++
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ make bash

      - name: Build compiler
        run: make

      - name: Run regression tests
        run: bash tests/regression.sh