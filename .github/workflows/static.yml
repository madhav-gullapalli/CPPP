name: Deploy CP++ site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "cppp_language.md"
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          python3 website/build.py --base-url "/${REPOSITORY_NAME}"
          python3 website/validate.py _site --base-url "/${REPOSITORY_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
