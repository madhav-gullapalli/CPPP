name: Regressions

on:
  push:
  pull_request:

jobs:
  regressions:
    name: Run shell regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ make bash

      - name: Run regression suite
        run: make test
